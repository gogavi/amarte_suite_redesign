<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/vectors/logo-monogram.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amarte Suite - El Planeta Romántico de Bogotá</title>
    <style>
      html, body { background: #0D0D11; margin: 0; }
      #root { position: relative; z-index: 1; }
      .lcp-poster {
        position: fixed;
        z-index: 0;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        object-fit: cover;
        object-position: center;
        background: #0D0D11;
      }
      .lcp-planet, .lcp-cta-slot {
        position: absolute;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .lcp-planet {
        z-index: 2;
        top: 57.4svh;
        width: 69.5vw;
        max-width: 423px;
        aspect-ratio: 1;
        height: auto;
        object-fit: cover;
        object-position: 50% 38%;
        border-radius: 50%;
        pointer-events: none;
      }
      .lcp-cta-slot {
        z-index: 3;
        top: 57.4svh;
        --mx: 0;
        --my: 0;
        pointer-events: none;
      }
      .lcp-cta-slot .v6-cta { pointer-events: auto; }
      html.is-gracias .lcp-planet,
      html.is-gracias .lcp-cta-slot { display: none; }
      @media (min-width: 768px) {
        .lcp-planet, .lcp-cta-slot { top: 69.3svh; }
        .lcp-planet { width: min(43.8vw, 423px); }
      }
    </style>
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      media="(max-width: 767px)"
      href="/src/assets/lcp/space-mobile-768.avif"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      media="(min-width: 768px)"
      href="/src/assets/lcp/space-desktop-1440.avif"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      href="/media/planeta-687.avif"
    />
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, '') || '/';
        if (path === '/gracias') document.documentElement.classList.add('is-gracias');
      })();
    </script>
    <!-- Fuentes (display=swap; sin @import bloqueante en CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Courgette&family=Fjalla+One&family=Jost:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Courgette&family=Fjalla+One&family=Jost:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-bg-dark text-white font-body overflow-x-hidden">
    <picture>
      <source
        media="(min-width: 768px)"
        type="image/avif"
        sizes="100vw"
        srcset="/src/assets/lcp/space-desktop-960.avif 960w, /src/assets/lcp/space-desktop-1440.avif 1440w, /src/assets/lcp/space-desktop-1920.avif 1920w"
      />
      <source
        media="(min-width: 768px)"
        type="image/webp"
        sizes="100vw"
        srcset="/src/assets/lcp/space-desktop-960.webp 960w, /src/assets/lcp/space-desktop-1440.webp 1440w, /src/assets/lcp/space-desktop-1920.webp 1920w"
      />
      <source
        type="image/avif"
        sizes="100vw"
        srcset="/src/assets/lcp/space-mobile-480.avif 480w, /src/assets/lcp/space-mobile-768.avif 768w, /src/assets/lcp/space-mobile-1200.avif 1200w"
      />
      <source
        type="image/webp"
        sizes="100vw"
        srcset="/src/assets/lcp/space-mobile-480.webp 480w, /src/assets/lcp/space-mobile-768.webp 768w, /src/assets/lcp/space-mobile-1200.webp 1200w"
      />
      <img
        id="lcp-poster"
        class="lcp-poster"
        alt=""
        width="768"
        height="1152"
        fetchpriority="high"
        decoding="sync"
        loading="eager"
        src="/src/assets/lcp/space-mobile-768.webp"
      />
    </picture>
    <img
      id="lcp-planet"
      class="lcp-planet"
      alt=""
      width="687"
      height="1024"
      fetchpriority="high"
      decoding="sync"
      loading="eager"
      src="/media/planeta-687.avif"
    />
    <div id="lcp-cta-slot" class="lcp-cta-slot"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
